name: graphhacks-persistent

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: vulngraph-falkordb-durable
    ports:
      - "6379:6379"
      - "3000:3000"
    environment:
      REDIS_ARGS: "--save 900 1 --save 300 10 --save 60 10000 --appendonly yes --appendfsync everysec"
    volumes:
      - type: volume
        source: falkordb_data
        target: /var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vulngraph-backend-durable
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      FALKORDB_GRAPH_NAME: vulngraph
      API_CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://localhost:5175","http://localhost:3000","https://ghost-iota-wheat.vercel.app","https://ghost-1s7kwj1g2-smita-142s-projects.vercel.app"]'
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  falkordb_data:
    name: graphhacks_falkordb_persistent
    external: true

networks:
  default:
    name: graphhacks_default
    external: true
